name: collect

# 収集を3つのジョブに分けて実行時間を抑える。
# 直前情報とオッズは締切が近いレースだけに絞っている。
#
# リポジトリをPublicにしているため実行時間の課金は無いが、
# 絞り込みは維持する。公式サイトへの負荷を無闇に増やさないため。
#
# 実測: GitHubのランナー(US)からboatrace.jpまでは1リクエスト約12秒かかる。
# うち2秒が自前のレート制限で、残りはレイテンシ。日本から実行した場合の
# 約5倍なので、所要時間を見積もるときはこの差を忘れないこと。
#
# GitHub Actionsのcronは UTC。JST = UTC+9。
#
# 重要: スケジュールは保証されない。実測では morning が99分、
# results が4時間遅れ、30分毎に設定した prerace は1日1回しか
# 発火しなかった。高頻度に設定するほど間引かれやすい。
#
# そのため prerace は毎時に落とし、代わりに窓を75分と広く取る。
# 発火が1〜2時間飛んでも、次の実行で取りこぼしを拾えるようにするため。
# results も、遅延で日付が変わっても前日を対象にするようjobs.py側で
# 判定している。
#
# 注意: スケジュール実行はリポジトリが60日間無活動になると自動で停止する。
#       停止したらGitHubのUIから手動で再有効化が必要。

on:
  schedule:
    - cron: '0 0 * * *'        # 09:00 JST 出走表
    - cron: '0 1-12 * * *'     # 10:00-21:00 JST 直前情報とオッズ（毎時）
    - cron: '0 13 * * *'       # 22:00 JST 確定結果
  workflow_dispatch:
    inputs:
      job:
        description: '手動実行するジョブ'
        required: true
        default: prerace
        type: choice
        options: [morning, prerace, results]

concurrency:
  group: collect
  cancel-in-progress: false   # 取得途中で止めると欠損が出るので待たせる

jobs:
  run:
    runs-on: ubuntu-latest
    # morning は169リクエスト、results は156リクエスト。
    # ランナーからは1リクエスト約12秒かかるため、どちらも30分では
    # 足りず打ち切られる。実測34分・31分に余裕を持たせて60分にする。
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # step単位のenvはそのstepのif条件からは参照できないため、
      # 通知の有無を判定できるようjobレベルに置く。
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: どのジョブを走らせるか決める
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 0 * * *')   echo "job=morning" >> "$GITHUB_OUTPUT" ;;
              '0 13 * * *')  echo "job=results" >> "$GITHUB_OUTPUT" ;;
              *)             echo "job=prerace" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # パーサーが壊れた状態で走らせると、欠損データが混ざって
      # 後から切り分けるのが面倒になる。取得の前に止める。
      - name: パーサーの回帰テスト
        run: python -m unittest discover -s tests

      # 対象日はここで一度だけ決め、収集と取り込みの両方に同じ値を渡す。
      # 取り込み側で date +%Y%m%d と組み立て直していたときは、
      # resultsが遅延して前日を対象にすると、収集は前日のファイルを書くのに
      # 取り込みは存在しない当日のファイルを見に行き、
      # 「取り込むデータなし」と表示して正常終了していた。
      - name: 収集
        id: collect
        run: |
          JOB='${{ steps.pick.outputs.job }}'
          DATE="$(python jobs.py target-date "$JOB")"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "$JOB" = "prerace" ]; then
            # 発火が飛んでも拾えるよう窓を広く取る（スケジュールは保証されない）
            python jobs.py prerace --window 75 "$DATE"
          else
            python jobs.py "$JOB" "$DATE"
          fi

      - name: Supabaseへ取り込み
        if: env.DATABASE_URL != ''
        run: python -m db.loader "output/${{ steps.collect.outputs.date }}.json"

      # 取得結果はリポジトリにコミットしない。公式サイトのデータを
      # 再配布しないため、また毎日数百KBずつ履歴が膨らむのを避けるため。
      # データの保存先はSupabase。DBを設定するまでは、下のアーティファクトで
      # 何が取れたかを確認する。
      - name: 取得結果をアーティファクトとして残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ steps.pick.outputs.job }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      # 失敗時だけ通知する。何も起きていないときに通知が来ないことが
      # 「1日5分で回す」運用の前提。
      #
      # 注意: 当初予定していた LINE Notify は2025年3月31日に終了済み。
      #       Discord/Slackのincoming webhook URLを WEBHOOK_URL に入れる。
      - name: 失敗を通知
        if: failure() && env.WEBHOOK_URL != ''
        run: |
          curl -sS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"[boatrace] ${{ steps.pick.outputs.job }} が失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
