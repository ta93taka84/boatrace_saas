name: collect

# 収集を3つのジョブに分けて実行時間を抑える。
# 直前情報とオッズは締切が近いレースだけに絞っている。
#
# リポジトリをPublicにしているため実行時間の課金は無いが、
# 絞り込みは維持する。公式サイトへの負荷を無闇に増やさないため。
#
# 実測: GitHubのランナー(US)からboatrace.jpまでは1リクエスト約12秒かかる。
# うち2秒が自前のレート制限で、残りはレイテンシ。日本から実行した場合の
# 約5倍なので、所要時間を見積もるときはこの差を忘れないこと。
#
# GitHub Actionsのcronは UTC。JST = UTC+9。
#
# 重要: スケジュールは保証されない。実測では morning が99分、
# results が4時間遅れ、30分毎に設定した prerace は1日1〜2回しか
# 発火しなかった。高頻度に設定するほど間引かれやすい。
#
# その結果、稼働2日でオッズが取れたのは10レースだけだった。締切前の
# 情報は「発火時刻の精度」に全面的に依存するので、毎時の発火を前提に
# した設計は成立しない。
#
# そこで prerace は prerace-loop に置き換える。1回起動したらプロセス内で
# ループし、指定時刻まで20分ごとに収集を繰り返す。発火回数への依存が
# 無くなるうえ、窓を30分と狭く取れるので締切に近いオッズが取れる。
#
# 1ジョブの上限が6時間なので、開催時間帯を3本に分けて起動する。
# 1本が間引かれても、残りの時間帯は影響を受けない。
#
# results は遅延で日付が変わっても前日を対象にするようjobs.py側で判定している。
#
# 注意: スケジュール実行はリポジトリが60日間無活動になると自動で停止する。
#       停止したらGitHubのUIから手動で再有効化が必要。

on:
  schedule:
    - cron: '0 0 * * *'        # 09:00 JST 出走表
    - cron: '30 0 * * *'       # 09:30 JST 直前情報ループ → 13:30 まで
    - cron: '30 4 * * *'       # 13:30 JST 直前情報ループ → 17:30 まで
    - cron: '30 8 * * *'       # 17:30 JST 直前情報ループ → 21:40 まで
    - cron: '0 13 * * *'       # 22:00 JST 確定結果
  workflow_dispatch:
    inputs:
      job:
        description: '手動実行するジョブ'
        required: true
        default: prerace
        type: choice
        # prerace は1回だけ走る動作確認用。本番は prerace-loop。
        options: [morning, prerace, prerace-loop, results]
      until:
        # cronが飛んだ時間帯を手動で埋めるときに使う。既定のまま昼過ぎに
        # 起動すると6時間の上限に当たって打ち切られるので、次の定時起動の
        # 直前を指定する。
        description: 'prerace-loop の終了時刻 (JST, HH:MM)'
        required: false
        default: '21:40'
        type: string

concurrency:
  group: collect
  cancel-in-progress: false   # 取得途中で止めると欠損が出るので待たせる

jobs:
  run:
    runs-on: ubuntu-latest
    # morning は169リクエスト、results は156リクエスト。ランナーからは
    # 1リクエスト約12秒かかるため、どちらも30分では足りず打ち切られる
    # （実測34分・31分）。prerace-loop は最長4時間ループするので、
    # GitHubの上限である360分をそのまま指定する。
    # ループ自身が終了時刻を持っているので、これは保険でしかない。
    timeout-minutes: 360
    env:
      TZ: Asia/Tokyo
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # step単位のenvはそのstepのif条件からは参照できないため、
      # 通知の有無を判定できるようjobレベルに置く。
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: どのジョブを走らせるか決める
        id: pick
        run: |
          # 連鎖の暴走を防ぐため、このジョブが何秒走ったかを後で測る
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
            echo "until=${{ inputs.until }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              '0 0 * * *')   echo "job=morning" >> "$GITHUB_OUTPUT" ;;
              '0 13 * * *')  echo "job=results" >> "$GITHUB_OUTPUT" ;;
              '30 0 * * *')  echo "job=prerace-loop" >> "$GITHUB_OUTPUT"
                             echo "until=13:30" >> "$GITHUB_OUTPUT" ;;
              '30 4 * * *')  echo "job=prerace-loop" >> "$GITHUB_OUTPUT"
                             echo "until=17:30" >> "$GITHUB_OUTPUT" ;;
              *)             echo "job=prerace-loop" >> "$GITHUB_OUTPUT"
                             echo "until=21:40" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # パーサーが壊れた状態で走らせると、欠損データが混ざって
      # 後から切り分けるのが面倒になる。取得の前に止める。
      - name: パーサーの回帰テスト
        run: python -m unittest discover -s tests

      # 対象日はここで一度だけ決め、収集・取り込み・キャッシュに同じ値を渡す。
      # 取り込み側で date +%Y%m%d と組み立て直していたときは、
      # resultsが遅延して前日を対象にすると、収集は前日のファイルを書くのに
      # 取り込みは存在しない当日のファイルを見に行き、
      # 「取り込むデータなし」と表示して正常終了していた。
      - name: 対象日を決める
        id: date
        run: |
          echo "date=$(python jobs.py target-date '${{ steps.pick.outputs.job }}')" >> "$GITHUB_OUTPUT"

      # output/ はリポジトリに入れないので、ジョブ間で受け渡すにはキャッシュが要る。
      # 無いと prerace-loop が出走表を1レースずつ取り直し、同じ日の朝に
      # morning が取ったのと同じものを、1日ぶんもう一度取得することになる
      # （約170リクエスト）。公式サイトへの負荷を倍にしないため。
      - name: 収集済みデータの復元
        uses: actions/cache/restore@v4
        with:
          path: output
          key: output-${{ steps.date.outputs.date }}-
          restore-keys: output-${{ steps.date.outputs.date }}-

      - name: 収集
        id: collect
        run: |
          JOB='${{ steps.pick.outputs.job }}'
          DATE='${{ steps.date.outputs.date }}'
          case "$JOB" in
            prerace-loop)
              python jobs.py prerace-loop --until '${{ steps.pick.outputs.until }}' --interval 20 --window 30 "$DATE"
              ;;
            prerace)
              # 1回だけ走る動作確認用。本番のスケジュールは prerace-loop。
              python jobs.py prerace --window 40 "$DATE"
              ;;
            *)
              python jobs.py "$JOB" "$DATE"
              ;;
          esac

      # キャッシュのキーは一度書くと変えられないので、run_id を付けて毎回別の
      # キーで保存し、復元側は接頭辞一致で最新を拾う。収集が途中で落ちても
      # そこまでの取得結果は残したいので always() で保存する。
      - name: 収集済みデータの保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output
          key: output-${{ steps.date.outputs.date }}-${{ github.run_id }}

      # prerace-loop は各パスの直後に自分で取り込むので、ここでは走らせない。
      # オッズは時系列として追記されるテーブルなので、同じファイルを二度
      # 通すと同じ値のスナップショットが重複して積まれる。
      - name: Supabaseへ取り込み
        if: env.DATABASE_URL != '' && steps.pick.outputs.job != 'prerace-loop'
        run: python -m db.loader "output/${{ steps.date.outputs.date }}.json"

      # 取得結果はリポジトリにコミットしない。公式サイトのデータを
      # 再配布しないため、また毎日数百KBずつ履歴が膨らむのを避けるため。
      # データの保存先はSupabase。DBを設定するまでは、下のアーティファクトで
      # 何が取れたかを確認する。
      - name: 取得結果をアーティファクトとして残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ steps.pick.outputs.job }}-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      # 次の prerace-loop を自分で予約する。
      #
      # GitHubのcronは実測で1日2〜3回しか発火せず、しかも発火するのは常に
      # morning と results の枠だった。prerace-loop に割り当てた3本は
      # 3日間で一度も発火していない。cronの本数を増やしても発火数は増えない。
      #
      # そこで、確実に発火している1回を起点にして、以降は各実行が次を予約する
      # 形にする。これで cron への依存は「1日どこかで1回発火すること」だけになる。
      #
      # GITHUB_TOKEN では workflow_dispatch を起こせない（無限再帰を防ぐための
      # GitHubの仕様）ので、Actionsの書き込み権限を持つ PAT を DISPATCH_TOKEN
      # に入れる必要がある。未設定なら何もしない＝従来どおりcron頼みになる。
      #
      # 暴走への歯止めを3つ置いている。連鎖する仕組みは、失敗が高速で
      # 繰り返されると実行時間と公式サイトへの負荷を際限なく使うため。
      #   - 開催時間帯（09:00〜21:40）の外では予約しない
      #   - results からは予約しない（その日の最後のジョブなので）
      #   - 10分未満で終わった実行からは予約しない。すぐ落ちる状態で
      #     連鎖すると、1分ごとに起動を繰り返すことになる
      - name: 次のループを予約する
        if: always() && steps.pick.outputs.job != 'results'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "DISPATCH_TOKEN が未設定のため予約しない（cron頼みのまま）"
            exit 0
          fi

          ELAPSED=$(( $(date +%s) - ${{ steps.pick.outputs.started }} ))
          if [ "$ELAPSED" -lt 600 ]; then
            echo "この実行は${ELAPSED}秒で終わっている。異常の疑いがあるので予約しない"
            exit 0
          fi

          NOW=$(date +%H%M)
          if [ "$NOW" -lt 900 ] || [ "$NOW" -ge 2140 ]; then
            echo "開催時間帯の外（現在 $NOW）なので予約しない"
            exit 0
          fi

          # 次の終了時刻は「今から5時間20分後」と 21:40 の早いほう。
          # 1ジョブの上限が6時間なので、準備の時間を見て5時間20分に抑える。
          NEXT=$(date -d '+5 hours 20 minutes' +%H:%M)
          NEXTN=$(echo "$NEXT" | tr -d ':')
          if [ "$NEXTN" -ge 2140 ] || [ "$NEXTN" -lt "$NOW" ]; then
            NEXT=21:40
          fi

          echo "次の prerace-loop を予約する（終了 $NEXT）"
          CODE=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $DISPATCH_TOKEN"             -H "Accept: application/vnd.github+json"             "${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches"             -d "{\"ref\":\"main\",\"inputs\":{\"job\":\"prerace-loop\",\"until\":\"$NEXT\"}}")

          # 予約に失敗すると、その日の残りが黙って収集されないまま終わる。
          # トークンの期限切れが典型なので、必ず失敗として通知させる。
          if [ "$CODE" != "204" ]; then
            echo "次のループの予約に失敗した (HTTP $CODE)"
            cat /tmp/dispatch.json
            exit 1
          fi

      # 失敗時だけ通知する。何も起きていないときに通知が来ないことが
      # 「1日5分で回す」運用の前提。
      #
      # 注意: 当初予定していた LINE Notify は2025年3月31日に終了済み。
      #       Discord/Slackのincoming webhook URLを WEBHOOK_URL に入れる。
      - name: 失敗を通知
        if: failure() && env.WEBHOOK_URL != ''
        run: |
          curl -sS -X POST "$WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"[boatrace] ${{ steps.pick.outputs.job }} が失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
